<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やることリスト">
<title>やることリスト（仮）</title>
<style>
  :root { --text:#37352f; --sub:#9b9a97; --line:#e9e9e7; --btn:#2383e2; --err:#d44c47; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); background: #fff; font-size: 17px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  [hidden] { display: none !important; }
  h1 { font-size: 24px; margin: 12px 0 16px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  label { display: block; margin-top: 8px; font-size: 15px; color: var(--sub); }
  input, select {
    width: 100%; font-size: 17px; padding: 12px; margin: 4px 0 8px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button {
    width: 100%; font-size: 17px; padding: 12px 16px; margin-top: 8px;
    border: none; border-radius: 8px; background: var(--btn); color: #fff;
  }
  button.sub { background: #f1f1ef; color: var(--text); width: auto; margin-top: 0; }
  button.small { width: auto; margin: 0 0 0 8px; padding: 4px 10px; font-size: 14px; }
  button.danger { background: #f1f1ef; color: var(--err); width: auto; margin-top: 0; }
  .msg { color: var(--err); font-size: 15px; min-height: 20px; }
  .empty { color: var(--sub); text-align: center; padding: 24px 0; }
  details { margin-top: 12px; }
  summary { font-size: 17px; font-weight: 600; padding: 10px 0; cursor: pointer; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item .days { color: var(--sub); font-size: 15px; white-space: nowrap; }
  .meta { color: var(--sub); font-size: 14px; }
  .info > div { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .info .label { color: var(--sub); display: inline-block; width: 6em; }
  .hist { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .editBox { padding: 8px 0; }
  .catRow { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .catRow .name { flex: 1; }
  /* 片手（右手）で押しやすいよう、主な操作は右側に置く */
  .actions { display: flex; gap: 8px; }
  .actions > button { flex: 1; width: auto; margin-top: 8px; }
  .actions > #doneBtn, .actions > #resumeBtn { flex: 2; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ログイン画面 -->
  <section id="loginView" hidden>
    <h1>やることリスト（仮）</h1>
    <form id="loginForm">
      <label>メールアドレス
        <input id="email" type="email" autocomplete="username" required>
      </label>
      <label>パスワード
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">ログイン</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </section>

  <!-- 一覧画面 -->
  <section id="appView" hidden>
    <div class="row">
      <h1 style="flex:1">やることリスト</h1>
      <button id="settingsBtn" class="sub">設定</button>
      <button id="logoutBtn" class="sub">ログアウト</button>
    </div>

    <form id="addForm">
      <label>項目名
        <input id="name" maxlength="50" placeholder="例：お風呂掃除" required>
      </label>
      <label>周期</label>
      <div class="row">
        <input id="cycleCount" type="number" min="1" step="1" value="1" required>
        <select id="cycleUnit">
          <option value="d">日</option>
          <option value="w" selected>週間</option>
          <option value="m">ヶ月</option>
          <option value="y">年</option>
        </select>
      </div>
      <label>カテゴリ
        <select id="addCat"></select>
      </label>
      <label>最後に実施した日
        <input id="lastDone" type="date" required>
      </label>
      <button type="submit">＋ 追加</button>
      <p id="addMsg" class="msg"></p>
    </form>

    <div id="list"></div>
  </section>

  <!-- 詳細画面 -->
  <section id="detailView" hidden>
    <div class="row">
      <button id="backBtn" class="sub">← 一覧</button>
    </div>
    <h1 id="dName"></h1>
    <div class="info">
      <div><span class="label">状態</span><span id="dStatus"></span></div>
      <div><span class="label">経過日数</span><span id="dDays"></span></div>
      <div><span class="label">周期</span><span id="dCycle"></span></div>
      <div id="catRow" hidden><span class="label">カテゴリ</span><span id="dCat"></span></div>
      <div>
        <span class="label">最終実施日</span><span id="dLast"></span>
        <button id="editLastBtn" class="sub small">変更</button>
      </div>
    </div>

    <div id="editLast" class="editBox" hidden>
      <input id="newLast" type="date">
      <div class="actions">
        <button id="cancelLastBtn" class="sub">キャンセル</button>
        <button id="saveLastBtn">保存</button>
      </div>
    </div>

    <button id="openCatBtn" class="sub" style="margin-top:8px">🏷️ カテゴリを設定・変更</button>
    <div id="editCat" class="editBox" hidden>
      <select id="newCat"></select>
      <div class="actions">
        <button id="cancelCatBtn" class="sub">キャンセル</button>
        <button id="saveCatBtn">保存</button>
      </div>
    </div>

    <div id="activeActions" class="actions">
      <button id="pauseBtn" class="sub">⏸️ 一時停止</button>
      <button id="doneBtn">✅ 実施した</button>
    </div>
    <div id="pausedActions" class="actions" hidden>
      <span class="spacer"></span>
      <button id="resumeBtn">▶️ 再開</button>
    </div>
    <p id="detailMsg" class="msg"></p>

    <h2>実施履歴</h2>
    <div id="history"></div>
    <button id="moreBtn" class="sub" hidden>もっと見る</button>
  </section>

  <!-- 設定画面 -->
  <section id="settingsView" hidden>
    <div class="row">
      <button id="settingsBackBtn" class="sub">← 一覧</button>
    </div>
    <h1>設定</h1>

    <h2>カテゴリ管理</h2>
    <div id="catList"></div>
    <form id="catAddForm">
      <label>新しいカテゴリ名
        <input id="newCatName" maxlength="20" required>
      </label>
      <button type="submit">＋ カテゴリを追加</button>
      <p id="catMsg" class="msg"></p>
    </form>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== Firebaseの接続情報 =====
const firebaseConfig = {
  apiKey: "AIzaSyAfqtmYf_-inDRo6yEfbfkJjTAlBtHPao8",
  authDomain: "house-todo-1ef41.firebaseapp.com",
  projectId: "house-todo-1ef41",
  storageBucket: "house-todo-1ef41.firebasestorage.app",
  messagingSenderId: "956040670932",
  appId: "1:956040670932:web:ee3b3d87e7f7e14b2ad541"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COL = "housework_items";       // 項目
const HIST = "housework_history";    // 実施履歴（{ itemId, date }）
const CAT = "housework_categories";  // カテゴリ（{ name, order }）
const SETTINGS = "housework_settings"; // 初期データを入れたかどうかの印

const DEFAULT_CATS = ["掃除", "メンテナンス", "消耗品・交換", "身の回り", "その他"];

// ===== 日付の小さな道具 =====
const DAY = 86400000;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const showDate = s => s.replaceAll("-", "/");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

// 日・週間は日数で足す。ヶ月・年は暦の上で足し、月末は月の最終日に合わせる
function addPeriod(base, unit, count) {
  if (unit === "d" || unit === "w") {
    const days = unit === "w" ? 7 * count : count;
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
  }
  const months = unit === "y" ? 12 * count : count;
  const first = new Date(base.getFullYear(), base.getMonth() + months, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(base.getDate(), last));
}

// 状態判定：計測開始日を基準に、1周期後以上で「そろそろ」、2周期後以上で「やばい」
// 一時停止中は、停止した時点の経過日数を保持する
function judge(item) {
  if (item.paused) {
    return { key: "paused", days: item.pausedDays ?? 0 };
  }
  const base = parse(item.startDate || item.lastDone);
  const t = today();
  const next1 = addPeriod(base, item.cycleUnit, item.cycleCount);
  const next2 = addPeriod(base, item.cycleUnit, item.cycleCount * 2);
  const days = Math.round((t - base) / DAY);
  let key = "normal";
  if (t >= next2) key = "danger";
  else if (t >= next1) key = "soon";
  return { key, days };
}

const ICON = { danger: "🔴", soon: "🟡", normal: "⚪", paused: "⏸️" };
const LABEL = { danger: "やばい", soon: "そろそろ", normal: "通常", paused: "一時停止中" };
const UNIT = { d: "日", w: "週間", m: "ヶ月", y: "年" };
const ORDER = ["danger", "soon", "normal", "paused"];

// ===== 画面の状態 =====
let items = [];
let unsubscribe = null;
let cats = [];
let catUnsub = null;
let currentId = null;
let histItems = [];
let histUnsub = null;
let showAllHist = false;

function showView(name) {
  $("loginView").hidden = name !== "login";
  $("appView").hidden = name !== "list";
  $("detailView").hidden = name !== "detail";
  $("settingsView").hidden = name !== "settings";
}

// ===== カテゴリ =====
function catName(id) {
  const c = cats.find(x => x.id === id);
  return c ? c.name : null;
}

// 初回だけ、既定のカテゴリを入れる（同じIDで書くので、2台同時でも重複しない）
async function ensureDefaultCategories() {
  const ref = db.collection(SETTINGS).doc("main");
  const snap = await ref.get();
  if (snap.exists && snap.data().categoriesSeeded) return;
  const batch = db.batch();
  DEFAULT_CATS.forEach((name, i) => {
    batch.set(db.collection(CAT).doc(`default-${i + 1}`), { name, order: i + 1 });
  });
  batch.set(ref, { categoriesSeeded: true }, { merge: true });
  await batch.commit();
}

function startCategories() {
  catUnsub = db.collection(CAT).onSnapshot(
    snap => {
      cats = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.id.localeCompare(b.id));
      renderCategoryUI();
    },
    err => console.error(err)
  );
}

function stopCategories() {
  if (catUnsub) catUnsub();
  catUnsub = null;
  cats = [];
}

// カテゴリの選択肢（追加フォーム・詳細の変更欄）と、設定画面の一覧を作り直す
function renderCategoryUI() {
  const fill = (sel, keep) => {
    const cur = sel.value;
    sel.textContent = "";
    sel.appendChild(new Option("（なし）", ""));
    cats.forEach(c => sel.appendChild(new Option(c.name, c.id)));
    if (keep) sel.value = cur;
  };
  fill($("addCat"), true);
  fill($("newCat"), true);
  renderCatList();
  if (currentId) renderDetail();
}

function renderCatList() {
  const box = $("catList");
  box.textContent = "";
  if (!cats.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "カテゴリはまだありません";
    box.appendChild(p);
    return;
  }
  for (const c of cats) {
    const row = document.createElement("div");
    row.className = "catRow";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = c.name;

    const renameBtn = document.createElement("button");
    renameBtn.className = "sub small";
    renameBtn.textContent = "名前変更";
    renameBtn.addEventListener("click", () => renameCategory(c));

    const delBtn = document.createElement("button");
    delBtn.className = "danger small";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", () => deleteCategory(c));

    row.append(name, renameBtn, delBtn);
    box.appendChild(row);
  }
}

function hasSameName(name, exceptId) {
  return cats.some(c => c.name === name && c.id !== exceptId);
}

async function renameCategory(c) {
  $("catMsg").textContent = "";
  const next = (prompt("新しい名前", c.name) ?? "").trim();
  if (!next || next === c.name) return;
  if (hasSameName(next, c.id)) { $("catMsg").textContent = "同じ名前のカテゴリがあります"; return; }
  try {
    await db.collection(CAT).doc(c.id).update({ name: next });
  } catch (err) {
    console.error(err);
    $("catMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

// 削除：所属する項目はカテゴリなしにする（項目自体は消さない）
async function deleteCategory(c) {
  $("catMsg").textContent = "";
  if (!confirm(`「${c.name}」を削除しますか？\n所属している項目はカテゴリなしになります。`)) return;
  try {
    const batch = db.batch();
    batch.delete(db.collection(CAT).doc(c.id));
    items.filter(it => it.categoryId === c.id).forEach(it => {
      batch.update(db.collection(COL).doc(it.id), { categoryId: null });
    });
    await batch.commit();
  } catch (err) {
    console.error(err);
    $("catMsg").textContent = "削除できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

$("catAddForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("catMsg").textContent = "";
  const name = $("newCatName").value.trim();
  if (!name) { $("catMsg").textContent = "カテゴリ名を入力してください"; return; }
  if (hasSameName(name, null)) { $("catMsg").textContent = "同じ名前のカテゴリがあります"; return; }
  const order = cats.reduce((m, c) => Math.max(m, c.order ?? 0), 0) + 1;
  try {
    await db.collection(CAT).add({ name, order });
    $("newCatName").value = "";
  } catch (err) {
    console.error(err);
    $("catMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

// ===== 一覧の表示 =====
function render() {
  const list = $("list");
  list.textContent = "";
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "登録されている項目はありません";
    list.appendChild(p);
    return;
  }

  const judged = items.map(it => ({ ...it, ...judge(it) }));
  judged.sort((a, b) =>
    ORDER.indexOf(a.key) - ORDER.indexOf(b.key) ||
    b.days - a.days ||
    a.id.localeCompare(b.id)
  );

  for (const key of ORDER) {
    const group = judged.filter(x => x.key === key);
    if (!group.length) continue;

    const details = document.createElement("details");
    details.open = key !== "normal";
    const summary = document.createElement("summary");
    summary.textContent = `${ICON[key]} ${LABEL[key]}（${group.length}件）`;
    details.appendChild(summary);

    for (const it of group) {
      const row = document.createElement("div");
      row.className = "item";
      row.addEventListener("click", () => openDetail(it.id));

      const icon = document.createElement("span");
      icon.textContent = ICON[key];

      const left = document.createElement("div");
      left.style.flex = "1";
      const title = document.createElement("div");
      title.textContent = it.name;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `周期 ${it.cycleCount}${UNIT[it.cycleUnit]}`;
      left.append(title, meta);

      const days = document.createElement("span");
      days.className = "days";
      days.textContent = `${it.days}日`;

      row.append(icon, left, days);
      details.appendChild(row);
    }
    list.appendChild(details);
  }
}

function startListening() {
  unsubscribe = db.collection(COL).onSnapshot(
    snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
      if (currentId) renderDetail();
    },
    err => {
      console.error(err);
      $("list").textContent = "データを読み込めませんでした。通信状態を確認して、開き直してください。";
    }
  );
}

function stopListening() {
  if (unsubscribe) unsubscribe();
  unsubscribe = null;
  items = [];
  $("list").textContent = "";
}

// ===== 詳細画面 =====
function openDetail(id) {
  currentId = id;
  showAllHist = false;
  $("detailMsg").textContent = "";
  $("editLast").hidden = true;
  $("editCat").hidden = true;
  if (histUnsub) histUnsub();
  histUnsub = db.collection(HIST).where("itemId", "==", id).onSnapshot(
    snap => {
      histItems = snap.docs.map(d => d.data().date).sort().reverse();
      renderDetail();
    },
    err => console.error(err)
  );
  renderDetail();
  showView("detail");
  window.scrollTo(0, 0);
}

function closeDetail() {
  currentId = null;
  if (histUnsub) histUnsub();
  histUnsub = null;
  histItems = [];
  showView("list");
}

function renderDetail() {
  const it = items.find(x => x.id === currentId);
  if (!it) { closeDetail(); return; } // 項目が見つからない場合は一覧へ戻る
  const j = judge(it);

  $("dName").textContent = it.name;
  $("dStatus").textContent = `${ICON[j.key]} ${LABEL[j.key]}`;
  $("dDays").textContent = `${j.days}日`;
  $("dCycle").textContent = `${it.cycleCount}${UNIT[it.cycleUnit]}`;
  $("dLast").textContent = showDate(it.lastDone);

  // カテゴリは設定されているときだけ表示する
  const cname = it.categoryId ? catName(it.categoryId) : null;
  $("catRow").hidden = !cname;
  $("dCat").textContent = cname || "";

  // 一時停止中は「実施した」「一時停止」を隠し、「再開」だけ出す
  $("activeActions").hidden = Boolean(it.paused);
  $("pausedActions").hidden = !it.paused;

  const hist = $("history");
  hist.textContent = "";
  const shown = showAllHist ? histItems : histItems.slice(0, 5);
  if (!shown.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "まだ実施履歴はありません";
    hist.appendChild(p);
  }
  for (const date of shown) {
    const row = document.createElement("div");
    row.className = "hist";
    row.textContent = showDate(date);
    hist.appendChild(row);
  }
  $("moreBtn").hidden = showAllHist || histItems.length <= 5;
}

$("backBtn").addEventListener("click", closeDetail);
$("moreBtn").addEventListener("click", () => { showAllHist = true; renderDetail(); });

// 共通：項目の更新を保存。成功なら true、失敗ならメッセージを出して false
async function updateItem(fields) {
  const it = items.find(x => x.id === currentId);
  if (!it) return false;
  $("detailMsg").textContent = "";
  try {
    await db.collection(COL).doc(it.id).update(fields);
    return true;
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
    return false;
  }
}

// 「実施した」：最終実施日と計測開始日を今日にし、履歴を追加する（まとめて保存）
$("doneBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("detailMsg").textContent = "";
  if (!confirm("実施しましたか？")) return;

  const dateStr = fmt(today());
  try {
    const batch = db.batch();
    batch.update(db.collection(COL).doc(it.id), { lastDone: dateStr, startDate: dateStr });
    batch.set(db.collection(HIST).doc(), { itemId: it.id, date: dateStr });
    await batch.commit();
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

// 一時停止：停止した時点の経過日数を保存する（履歴には残さない）
$("pauseBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  if (!confirm("一時停止しますか？")) return;
  await updateItem({ paused: true, pausedDays: judge(it).days });
});

// 再開：計測開始日を今日にし、経過日数を0に戻す（最終実施日と履歴は変えない）
$("resumeBtn").addEventListener("click", async () => {
  if (!confirm("再開しますか？")) return;
  await updateItem({ paused: false, pausedDays: 0, startDate: fmt(today()) });
});

// 最終実施日の変更：最終実施日と計測開始日を同じ日に合わせる（履歴は追加しない）
$("editLastBtn").addEventListener("click", () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("newLast").value = it.lastDone;
  $("newLast").max = fmt(today());
  $("detailMsg").textContent = "";
  $("editLast").hidden = false;
});

$("cancelLastBtn").addEventListener("click", () => {
  $("editLast").hidden = true;
});

$("saveLastBtn").addEventListener("click", async () => {
  const v = $("newLast").value;
  if (!v) { $("detailMsg").textContent = "日付を入力してください"; return; }
  if (v > fmt(today())) { $("detailMsg").textContent = "今日より後の日付は選べません"; return; }
  if (!confirm(`最終実施日を ${showDate(v)} に変更しますか？`)) return;
  const ok = await updateItem({ lastDone: v, startDate: v });
  if (ok) $("editLast").hidden = true;
});

// カテゴリの設定・変更（「なし」を選ぶと未設定に戻る）
$("openCatBtn").addEventListener("click", () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("newCat").value = it.categoryId || "";
  $("detailMsg").textContent = "";
  $("editCat").hidden = false;
});

$("cancelCatBtn").addEventListener("click", () => {
  $("editCat").hidden = true;
});

$("saveCatBtn").addEventListener("click", async () => {
  const v = $("newCat").value || null;
  const ok = await updateItem({ categoryId: v });
  if (ok) $("editCat").hidden = true;
});

// ===== 項目の追加 =====
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("addMsg");
  msg.textContent = "";

  const name = $("name").value.trim();
  const count = Number($("cycleCount").value);
  if (!name) { msg.textContent = "項目名を入力してください"; return; }
  if (!Number.isInteger(count) || count < 1) { msg.textContent = "周期は1以上の整数で入力してください"; return; }

  const lastDone = $("lastDone").value;
  try {
    await db.collection(COL).add({
      name,
      cycleCount: count,
      cycleUnit: $("cycleUnit").value,
      categoryId: $("addCat").value || null,
      lastDone,
      startDate: lastDone,
      paused: false
    });
    $("name").value = "";
    $("cycleCount").value = 1;
    $("cycleUnit").value = "w";
    $("addCat").value = "";
    $("lastDone").value = fmt(today());
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

// ===== 画面の移動 =====
$("settingsBtn").addEventListener("click", () => { $("catMsg").textContent = ""; showView("settings"); });
$("settingsBackBtn").addEventListener("click", () => showView("list"));

// ===== ログイン・ログアウト =====
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = "";
  try {
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
    $("password").value = "";
  } catch (err) {
    console.error(err);
    $("loginMsg").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
  }
});

$("logoutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(async user => {
  if (user) {
    showView("list");
    $("lastDone").value = fmt(today());
    if (!unsubscribe) startListening();
    if (!catUnsub) startCategories();
    try {
      await ensureDefaultCategories();
    } catch (err) {
      console.error(err);
    }
  } else {
    closeDetail();
    stopListening();
    stopCategories();
    showView("login");
  }
});
</script>
</body>
</html>
