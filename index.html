<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やることリスト">
<title>やることリスト（仮）</title>
<style>
  :root { --text:#37352f; --sub:#9b9a97; --line:#e9e9e7; --btn:#2383e2; --err:#d44c47; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); background: #fff; font-size: 17px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  [hidden] { display: none !important; }
  h1 { font-size: 24px; margin: 12px 0 16px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  label { display: block; margin-top: 8px; font-size: 15px; color: var(--sub); }
  input, select {
    width: 100%; font-size: 17px; padding: 12px; margin: 4px 0 8px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button {
    width: 100%; font-size: 17px; padding: 12px 16px; margin-top: 8px;
    border: none; border-radius: 8px; background: var(--btn); color: #fff;
  }
  button.sub { background: #f1f1ef; color: var(--text); width: auto; margin-top: 0; }
  button.small { width: auto; margin: 0 0 0 8px; padding: 4px 10px; font-size: 14px; }
  button.danger { background: #f1f1ef; color: var(--err); width: auto; margin-top: 0; }
  button.wide { background: #f1f1ef; color: var(--text); margin-top: 24px; }
  .msg { color: var(--err); font-size: 15px; min-height: 20px; }
  .empty { color: var(--sub); text-align: center; padding: 24px 0; }
  details { margin-top: 12px; }
  summary { font-size: 17px; font-weight: 600; padding: 10px 0; cursor: pointer; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item .days { color: var(--sub); font-size: 15px; white-space: nowrap; }
  .meta { color: var(--sub); font-size: 14px; }
  .unset { color: var(--sub); }
  .notice { background: #fbf6e9; border-radius: 8px; padding: 10px 12px; margin: 8px 0 4px; }
  .noticeTitle { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .noticeRow { padding: 6px 0; cursor: pointer; }
  .tag { font-size: 13px; color: var(--text); background: #f1f1ef; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  .info > div { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .info .label + span { flex: 1; }
  .info .label { color: var(--sub); display: inline-block; width: 6em; }
  .hist { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .editBox { padding: 8px 0; }
  .listRow { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .listRow .name { flex: 1; }
  /* 片手（右手）で押しやすいよう、主な操作は右側に置く */
  .actions { display: flex; gap: 8px; }
  .actions > button { flex: 1; width: auto; margin-top: 8px; }
  .actions > #doneBtn, .actions > #resumeBtn { flex: 2; }
  .spacer { flex: 1; }
  .ver { font-size: 12px; color: var(--sub); font-weight: 400; }
  /* 入力欄をコンパクトに */
  /* 項目名などは「ラベル → 入力欄」を横に並べ、はみ出さないようにする */
  #addForm label { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font-size: 15px; color: var(--sub); }
  #addForm label input, #addForm label select,
  #addForm .row input, #addForm .row select {
    flex: 1; min-width: 0; width: 100%; margin: 0; font-size: 16px; padding: 8px 10px;
  }
  #addForm input[type=date] { -webkit-appearance: none; appearance: none; }
  #addForm .row { margin-top: 6px; }
  /* 入力欄の位置と幅をそろえる：ラベルは固定幅、入力欄は残りを埋める */
  #addForm .field { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #addForm .flabel { flex: none; width: 5.5em; font-size: 14px; color: var(--sub); white-space: nowrap; }
  #addForm .field > input, #addForm .field > select, #addForm .field > .ctrl2 { flex: 1; min-width: 0; }
  #addForm .field > input, #addForm .field > select { width: 100%; margin: 0; font-size: 16px; padding: 8px 10px; }
  #addForm .ctrl2 { display: flex; gap: 8px; }
  #addForm .ctrl2 > * { flex: 1; min-width: 0; width: auto; margin: 0; font-size: 16px; padding: 8px 10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ログイン画面 -->
  <section id="loginView" hidden>
    <h1>やることリスト（仮）</h1>
    <form id="loginForm">
      <label>メールアドレス
        <input id="email" type="email" autocomplete="username" required>
      </label>
      <label>パスワード
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">ログイン</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </section>

  <!-- 一覧画面 -->
  <section id="appView" hidden>
    <div class="row">
      <h1 style="flex:1">やることリスト <small id="appVer" class="ver"></small></h1>
      <button id="settingsBtn" class="sub">設定</button>
      <button id="logoutBtn" class="sub">ログアウト</button>
    </div>

    <div id="notice" class="notice" hidden></div>

    <form id="addForm">
      <div class="field">
        <span class="flabel">項目名</span>
        <input id="name" maxlength="50" placeholder="例：お風呂掃除" required>
      </div>
      <div class="field">
        <span class="flabel">周期</span>
        <div class="ctrl2">
          <input id="cycleCount" type="number" min="1" step="1" value="1" required>
          <select id="cycleUnit">
            <option value="d">日</option>
            <option value="w" selected>週間</option>
            <option value="m">ヶ月</option>
            <option value="y">年</option>
          </select>
        </div>
      </div>
      <div class="field">
        <span class="flabel">カテゴリ</span>
        <select id="add-cat"></select>
      </div>
      <div class="field">
        <span class="flabel">対象</span>
        <select id="add-target"></select>
      </div>
      <div class="field">
        <span class="flabel">最終実施日</span>
        <input id="lastDone" type="date" required>
      </div>
      <button type="submit">＋ 追加</button>
      <p id="addMsg" class="msg"></p>
    </form>

    <div id="list"></div>
  </section>

  <!-- 詳細画面 -->
  <section id="detailView" hidden>
    <div class="row">
      <h1 id="dName" style="flex:1"></h1>
      <button id="editNameBtn" class="sub small" style="flex:none;white-space:nowrap">変更</button>
    </div>
    <div id="editName" class="editBox" hidden>
      <input id="newName" maxlength="50">
      <div class="actions">
        <button id="cancelNameBtn" class="sub">キャンセル</button>
        <button id="saveNameBtn">保存</button>
      </div>
    </div>
    <div class="info">
      <div><span class="label">状態</span><span id="dStatus"></span></div>
      <div><span class="label">経過日数</span><span id="dDays"></span></div>
      <div><span class="label">周期</span><span id="dCycle"></span><button id="editCycleBtn" class="sub small">変更</button></div>
      <div id="row-cat"><span class="label">カテゴリ</span><span id="val-cat"></span><button id="open-cat" class="sub small">変更</button></div>
      <div id="row-target"><span class="label">対象</span><span id="val-target"></span><button id="open-target" class="sub small">変更</button></div>
      <div>
        <span class="label">最終実施日</span><span id="dLast"></span>
        <button id="editLastBtn" class="sub small">変更</button>
      </div>
    </div>

    <div id="editCycle" class="editBox" hidden>
      <div class="row">
        <input id="newCycleCount" type="number" min="1" step="1">
        <select id="newCycleUnit">
          <option value="d">日</option>
          <option value="w">週間</option>
          <option value="m">ヶ月</option>
          <option value="y">年</option>
        </select>
      </div>
      <div class="actions">
        <button id="cancelCycleBtn" class="sub">キャンセル</button>
        <button id="saveCycleBtn">保存</button>
      </div>
    </div>

    <div id="editLast" class="editBox" hidden>
      <input id="newLast" type="date">
      <div class="actions">
        <button id="cancelLastBtn" class="sub">キャンセル</button>
        <button id="saveLastBtn">保存</button>
      </div>
    </div>

    <div id="edit-cat" class="editBox" hidden>
      <select id="new-cat"></select>
      <div class="actions">
        <button id="cancel-cat" class="sub">キャンセル</button>
        <button id="save-cat">保存</button>
      </div>
    </div>

    <div id="edit-target" class="editBox" hidden>
      <select id="new-target"></select>
      <div class="actions">
        <button id="cancel-target" class="sub">キャンセル</button>
        <button id="save-target">保存</button>
      </div>
    </div>

    <div id="activeActions" class="actions">
      <button id="pauseBtn" class="sub">⏸️ 一時停止</button>
      <button id="doneBtn">✅ 実施した</button>
    </div>
    <div id="pausedActions" class="actions" hidden>
      <span class="spacer"></span>
      <button id="resumeBtn">▶️ 再開</button>
    </div>
    <p id="detailMsg" class="msg"></p>

    <h2>実施履歴</h2>
    <div id="history"></div>
    <button id="moreBtn" class="sub" hidden>もっと見る</button>

    <button id="deleteBtn" class="danger" style="width:100%;margin-top:24px">🗑 この項目を削除</button>
    <button id="backBtn" class="wide">← 一覧に戻る</button>
  </section>

  <!-- 設定画面 -->
  <section id="settingsView" hidden>
    <div class="row">
      <button id="settingsBackBtn" class="sub">← 一覧</button>
    </div>
    <h1>設定</h1>
    <h2>通知</h2>
    <p class="meta">ホーム画面のアイコンから開いて、通知を許可してください。</p>
    <button id="pushBtn">🔔 このiPhoneで通知を受け取る</button>
    <p id="pushMsg" class="msg"></p>

    <div id="settingsFrames"></div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ===== Firebaseの接続情報 =====
const firebaseConfig = {
  apiKey: "AIzaSyAfqtmYf_-inDRo6yEfbfkJjTAlBtHPao8",
  authDomain: "house-todo-1ef41.firebaseapp.com",
  projectId: "house-todo-1ef41",
  storageBucket: "house-todo-1ef41.firebasestorage.app",
  messagingSenderId: "956040670932",
  appId: "1:956040670932:web:ee3b3d87e7f7e14b2ad541"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COL = "housework_items";         // 項目
const HIST = "housework_history";      // 実施履歴（{ itemId, date }）
const SETTINGS = "housework_settings"; // 初期データを入れたかどうかの印
const APP_VERSION = "1.2"; // 変更するたびに上げる

// 項目に付ける「枠」。カテゴリと対象は別々に管理する
const FRAMES = [
  {
    key: "cat", label: "カテゴリ", coll: "housework_categories", field: "categoryId",
    seeded: "categoriesSeeded",
    defaults: ["掃除", "メンテナンス", "消耗品・交換", "身の回り", "その他"]
  },
  {
    key: "target", label: "対象", coll: "housework_targets", field: "targetId",
    seeded: "targetsSeeded",
    defaults: ["人の名前", "家", "車"]
  }
];
const frameState = Object.fromEntries(FRAMES.map(f => [f.key, { list: [], unsub: null }]));
const frameOf = key => FRAMES.find(f => f.key === key);

// ===== 日付の小さな道具 =====
const DAY = 86400000;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const showDate = s => s.replaceAll("-", "/");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

// 日・週間は日数で足す。ヶ月・年は暦の上で足し、月末は月の最終日に合わせる
function addPeriod(base, unit, count) {
  if (unit === "d" || unit === "w") {
    const days = unit === "w" ? 7 * count : count;
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
  }
  const months = unit === "y" ? 12 * count : count;
  const first = new Date(base.getFullYear(), base.getMonth() + months, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(base.getDate(), last));
}

// 状態判定：計測開始日を基準に、1周期後以上で「そろそろ」、2周期後以上で「やばい」
// 一時停止中は、停止した時点の経過日数を保持する
function judge(item) {
  if (item.paused) {
    return { key: "paused", days: item.pausedDays ?? 0 };
  }
  const base = parse(item.startDate || item.lastDone);
  const t = today();
  const next1 = addPeriod(base, item.cycleUnit, item.cycleCount);
  const next2 = addPeriod(base, item.cycleUnit, item.cycleCount * 2);
  const days = Math.round((t - base) / DAY);
  let key = "normal";
  if (t >= next2) key = "danger";
  else if (t >= next1) key = "soon";
  return { key, days };
}

const ICON = { danger: "🔴", soon: "🟡", normal: "⚪", paused: "⏸️" };
const LABEL = { danger: "やばい", soon: "そろそろ", normal: "通常", paused: "一時停止中" };
const UNIT = { d: "日", w: "週間", m: "ヶ月", y: "年" };
const ORDER = ["danger", "soon", "normal", "paused"];

// ===== 画面の状態 =====
let items = [];
let unsubscribe = null;
let currentId = null;
let histItems = [];
let histUnsub = null;
let showAllHist = false;

function showView(name) {
  $("loginView").hidden = name !== "login";
  $("appView").hidden = name !== "list";
  $("detailView").hidden = name !== "detail";
  $("settingsView").hidden = name !== "settings";
}

// ===== 枠（カテゴリ・対象）の共通処理 =====
function frameName(f, id) {
  const c = frameState[f.key].list.find(x => x.id === id);
  return c ? c.name : null;
}

// 初回だけ、既定の選択肢を入れる（同じIDで書くので、2台同時でも重複しない）
async function ensureDefaults(f) {
  const ref = db.collection(SETTINGS).doc("main");
  const snap = await ref.get();
  if (snap.exists && snap.data()[f.seeded]) return;
  const batch = db.batch();
  f.defaults.forEach((name, i) => {
    batch.set(db.collection(f.coll).doc(`default-${i + 1}`), { name, order: i + 1 });
  });
  batch.set(ref, { [f.seeded]: true }, { merge: true });
  await batch.commit();
}

function startFrame(f) {
  const st = frameState[f.key];
  st.unsub = db.collection(f.coll).onSnapshot(
    snap => {
      st.list = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.id.localeCompare(b.id));
      renderFrameUI();
    },
    err => console.error(err)
  );
}

function stopFrame(f) {
  const st = frameState[f.key];
  if (st.unsub) st.unsub();
  st.unsub = null;
  st.list = [];
}

// 選択肢（追加フォーム・詳細の変更欄）と、設定画面の一覧を作り直す
function renderFrameUI() {
  for (const f of FRAMES) {
    const list = frameState[f.key].list;
    for (const sel of [$(`add-${f.key}`), $(`new-${f.key}`)]) {
      const cur = sel.value;
      sel.textContent = "";
      sel.appendChild(new Option("（なし）", ""));
      list.forEach(c => sel.appendChild(new Option(c.name, c.id)));
      sel.value = cur;
    }
    renderFrameList(f);
  }
  render(); // 一覧の対象名も、枠の読み込み後に出し直す
  if (currentId) renderDetail();
}

function renderFrameList(f) {
  const box = $(`list-${f.key}`);
  const list = frameState[f.key].list;
  box.textContent = "";
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = `${f.label}はまだありません`;
    box.appendChild(p);
    return;
  }
  for (const c of list) {
    const row = document.createElement("div");
    row.className = "listRow";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = c.name;

    const renameBtn = document.createElement("button");
    renameBtn.className = "sub small";
    renameBtn.textContent = "名前変更";
    renameBtn.addEventListener("click", () => renameFrameItem(f, c));

    const delBtn = document.createElement("button");
    delBtn.className = "danger small";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", () => deleteFrameItem(f, c));

    row.append(name, renameBtn, delBtn);
    box.appendChild(row);
  }
}

function hasSameName(f, name, exceptId) {
  return frameState[f.key].list.some(c => c.name === name && c.id !== exceptId);
}

async function renameFrameItem(f, c) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  const next = (prompt("新しい名前", c.name) ?? "").trim();
  if (!next || next === c.name) return;
  if (hasSameName(f, next, c.id)) { msg.textContent = "同じ名前があります"; return; }
  try {
    await db.collection(f.coll).doc(c.id).update({ name: next });
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

// 削除：所属する項目は未設定にする（項目自体は消さない）
async function deleteFrameItem(f, c) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  if (!confirm(`「${c.name}」を削除しますか？\n所属している項目は未設定になります。`)) return;
  try {
    const batch = db.batch();
    batch.delete(db.collection(f.coll).doc(c.id));
    items.filter(it => it[f.field] === c.id).forEach(it => {
      batch.update(db.collection(COL).doc(it.id), { [f.field]: null });
    });
    await batch.commit();
  } catch (err) {
    console.error(err);
    msg.textContent = "削除できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

async function addFrameItem(f) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  const input = $(`input-${f.key}`);
  const name = input.value.trim();
  if (!name) { msg.textContent = `${f.label}名を入力してください`; return; }
  if (hasSameName(f, name, null)) { msg.textContent = "同じ名前があります"; return; }
  const order = frameState[f.key].list.reduce((m, c) => Math.max(m, c.order ?? 0), 0) + 1;
  try {
    await db.collection(f.coll).add({ name, order });
    input.value = "";
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

// 設定画面の枠ごとの部品を作る
function buildSettings() {
  const root = $("settingsFrames");
  for (const f of FRAMES) {
    const h = document.createElement("h2");
    h.textContent = `${f.label}管理`;
    const listBox = document.createElement("div");
    listBox.id = `list-${f.key}`;
    const form = document.createElement("form");
    form.id = `form-${f.key}`;
    form.innerHTML =
      `<label>新しい${f.label}名<input id="input-${f.key}" maxlength="20" required></label>` +
      `<button type="submit">＋ ${f.label}を追加</button>` +
      `<p id="msg-${f.key}" class="msg"></p>`;
    form.addEventListener("submit", e => { e.preventDefault(); addFrameItem(f); });
    root.append(h, listBox, form);
  }
}

// ===== 一覧の表示 =====
function render() {
  const list = $("list");
  list.textContent = "";
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "登録されている項目はありません";
    list.appendChild(p);
    return;
  }

  const judged = items.map(it => ({ ...it, ...judge(it) }));
  judged.sort((a, b) =>
    ORDER.indexOf(a.key) - ORDER.indexOf(b.key) ||
    b.days - a.days ||
    a.id.localeCompare(b.id)
  );

  for (const key of ORDER) {
    const group = judged.filter(x => x.key === key);
    if (!group.length) continue;

    const details = document.createElement("details");
    details.open = key !== "normal";
    const summary = document.createElement("summary");
    summary.textContent = `${ICON[key]} ${LABEL[key]}（${group.length}件）`;
    details.appendChild(summary);

    for (const it of group) {
      const row = document.createElement("div");
      row.className = "item";
      row.addEventListener("click", () => openDetail(it.id));

      const icon = document.createElement("span");
      icon.textContent = ICON[key];

      // 丸とタスク名の間に、対象の名前を小さく表示する
      const tName = it.targetId ? frameName(frameOf("target"), it.targetId) : null;
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = tName || "";
      tag.hidden = !tName;

      const left = document.createElement("div");
      left.style.flex = "1";
      const title = document.createElement("div");
      title.textContent = it.name;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `周期 ${it.cycleCount}${UNIT[it.cycleUnit]}`;
      left.append(title, meta);

      const days = document.createElement("span");
      days.className = "days";
      days.textContent = `${it.days}日`;

      row.append(icon, tag, left, days);
      details.appendChild(row);
    }
    list.appendChild(details);
  }
}

// ===== お知らせ（アプリを開いたときに、状態が変わった項目を知らせる） =====
// 通知済みの状態は、この端末ごとに保存する（同じ状態で何度も出さないため）
const NOTIFIED_KEY = "housework_notified";
let notices = [];

function loadNotified() {
  try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY) || "{}"); } catch (e) { return {}; }
}

function saveNotified(map) {
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(map)); } catch (e) { console.error(e); }
}

function checkNotices() {
  const map = loadNotified();
  let changed = false;
  const found = [];
  for (const it of items) {
    if (it.paused) continue; // 一時停止中は知らせない
    const { key } = judge(it);
    if (key === "normal") {
      if (map[it.id]) { delete map[it.id]; changed = true; } // 通常に戻ったら、次の変化で再び知らせる
      continue;
    }
    if (map[it.id] !== key) {
      map[it.id] = key;
      changed = true;
      found.push({ id: it.id, name: it.name, key });
    }
  }
  if (changed) saveNotified(map);

  for (const n of found) {
    notices = notices.filter(x => x.id !== n.id);
    notices.push(n);
  }
  // 項目が消えた、通常に戻った、停止した場合は、お知らせから外す
  notices = notices.filter(n => items.some(it => it.id === n.id && !it.paused && judge(it).key === n.key));
  renderNotice();
}

function renderNotice() {
  const box = $("notice");
  box.textContent = "";
  if (!notices.length) { box.hidden = true; return; }
  box.hidden = false;

  const title = document.createElement("div");
  title.className = "noticeTitle";
  title.textContent = "お知らせ";
  box.appendChild(title);

  for (const n of notices) {
    const row = document.createElement("div");
    row.className = "noticeRow";
    row.textContent = `${ICON[n.key]} ${n.name}：${LABEL[n.key]}`;
    row.addEventListener("click", () => openDetail(n.id));
    box.appendChild(row);
  }

  const close = document.createElement("button");
  close.className = "sub";
  close.textContent = "閉じる";
  close.style.marginTop = "6px";
  close.addEventListener("click", () => { notices = []; renderNotice(); });
  box.appendChild(close);
}

function startListening() {
  unsubscribe = db.collection(COL).onSnapshot(
    snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      checkNotices();
      render();
      if (currentId) renderDetail();
    },
    err => {
      console.error(err);
      $("list").textContent = "データを読み込めませんでした。通信状態を確認して、開き直してください。";
    }
  );
}

function stopListening() {
  notices = [];
  renderNotice();
  if (unsubscribe) unsubscribe();
  unsubscribe = null;
  items = [];
  $("list").textContent = "";
}

// ===== 詳細画面 =====
function openDetail(id) {
  currentId = id;
  showAllHist = false;
  $("detailMsg").textContent = "";
  $("editLast").hidden = true;
  for (const f of FRAMES) $(`edit-${f.key}`).hidden = true;
  $("editName").hidden = true;
  $("editCycle").hidden = true;
  if (histUnsub) histUnsub();
  histUnsub = db.collection(HIST).where("itemId", "==", id).onSnapshot(
    snap => {
      histItems = snap.docs.map(d => d.data().date).sort().reverse();
      renderDetail();
    },
    err => console.error(err)
  );
  renderDetail();
  showView("detail");
  window.scrollTo(0, 0);
}

function closeDetail() {
  currentId = null;
  if (histUnsub) histUnsub();
  histUnsub = null;
  histItems = [];
  showView("list");
}

function renderDetail() {
  const it = items.find(x => x.id === currentId);
  if (!it) { closeDetail(); return; } // 項目が見つからない場合は一覧へ戻る
  const j = judge(it);

  $("dName").textContent = it.name;
  $("dStatus").textContent = `${ICON[j.key]} ${LABEL[j.key]}`;
  $("dDays").textContent = `${j.days}日`;
  $("dCycle").textContent = `${it.cycleCount}${UNIT[it.cycleUnit]}`;
  $("dLast").textContent = showDate(it.lastDone);

  // 枠は常に表示し、未設定のときは「未設定」と出す
  for (const f of FRAMES) {
    const name = it[f.field] ? frameName(f, it[f.field]) : null;
    const val = $(`val-${f.key}`);
    val.textContent = name || "未設定";
    val.classList.toggle("unset", !name);
  }

  // 一時停止中は「実施した」「一時停止」を隠し、「再開」だけ出す
  $("activeActions").hidden = Boolean(it.paused);
  $("pausedActions").hidden = !it.paused;

  const hist = $("history");
  hist.textContent = "";
  const shown = showAllHist ? histItems : histItems.slice(0, 5);
  if (!shown.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "まだ実施履歴はありません";
    hist.appendChild(p);
  }
  for (const date of shown) {
    const row = document.createElement("div");
    row.className = "hist";
    row.textContent = showDate(date);
    hist.appendChild(row);
  }
  $("moreBtn").hidden = showAllHist || histItems.length <= 5;
}

$("backBtn").addEventListener("click", closeDetail);
$("moreBtn").addEventListener("click", () => { showAllHist = true; renderDetail(); });

// 共通：項目の更新を保存。成功なら true、失敗ならメッセージを出して false
async function updateItem(fields) {
  const it = items.find(x => x.id === currentId);
  if (!it) return false;
  $("detailMsg").textContent = "";
  try {
    await db.collection(COL).doc(it.id).update(fields);
    return true;
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
    return false;
  }
}

// 「実施した」：最終実施日と計測開始日を今日にし、履歴を追加する（まとめて保存）
$("doneBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("detailMsg").textContent = "";
  if (!confirm("実施しましたか？")) return;

  const dateStr = fmt(today());
  try {
    const batch = db.batch();
    batch.update(db.collection(COL).doc(it.id), { lastDone: dateStr, startDate: dateStr });
    batch.set(db.collection(HIST).doc(), { itemId: it.id, date: dateStr });
    await batch.commit();
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

// 一時停止：停止した時点の経過日数を保存する（履歴には残さない）
$("pauseBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  if (!confirm("一時停止しますか？")) return;
  await updateItem({ paused: true, pausedDays: judge(it).days });
});

// 再開：計測開始日を今日にし、経過日数を0に戻す（最終実施日と履歴は変えない）
$("resumeBtn").addEventListener("click", async () => {
  if (!confirm("再開しますか？")) return;
  await updateItem({ paused: false, pausedDays: 0, startDate: fmt(today()) });
});

// 項目の削除：実施履歴もまとめて消す（元に戻せない）
$("deleteBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  if (!confirm(`「${it.name}」を削除しますか？\n実施履歴もすべて消えて、元に戻せません。`)) return;
  try {
    const hist = await db.collection(HIST).where("itemId", "==", it.id).get();
    const batch = db.batch();
    hist.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection(COL).doc(it.id));
    await batch.commit();
    closeDetail();
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "削除できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

// 項目名の変更
$("editNameBtn").addEventListener("click", () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("newName").value = it.name;
  $("detailMsg").textContent = "";
  $("editName").hidden = false;
});

$("cancelNameBtn").addEventListener("click", () => {
  $("editName").hidden = true;
});

$("saveNameBtn").addEventListener("click", async () => {
  const v = $("newName").value.trim();
  if (!v) { $("detailMsg").textContent = "項目名を入力してください"; return; }
  const ok = await updateItem({ name: v });
  if (ok) $("editName").hidden = true;
});

// 周期の変更：計測開始日はそのままにして、新しい周期で状態を計算し直す
$("editCycleBtn").addEventListener("click", () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("newCycleCount").value = it.cycleCount;
  $("newCycleUnit").value = it.cycleUnit;
  $("detailMsg").textContent = "";
  $("editCycle").hidden = false;
});

$("cancelCycleBtn").addEventListener("click", () => {
  $("editCycle").hidden = true;
});

$("saveCycleBtn").addEventListener("click", async () => {
  const count = Number($("newCycleCount").value);
  if (!Number.isInteger(count) || count < 1) {
    $("detailMsg").textContent = "周期は1以上の整数で入力してください";
    return;
  }
  const ok = await updateItem({ cycleCount: count, cycleUnit: $("newCycleUnit").value });
  if (ok) $("editCycle").hidden = true;
});

// 最終実施日の変更：最終実施日と計測開始日を同じ日に合わせる（履歴は追加しない）
$("editLastBtn").addEventListener("click", () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("newLast").value = it.lastDone;
  $("newLast").max = fmt(today());
  $("detailMsg").textContent = "";
  $("editLast").hidden = false;
});

$("cancelLastBtn").addEventListener("click", () => {
  $("editLast").hidden = true;
});

$("saveLastBtn").addEventListener("click", async () => {
  const v = $("newLast").value;
  if (!v) { $("detailMsg").textContent = "日付を入力してください"; return; }
  if (v > fmt(today())) { $("detailMsg").textContent = "今日より後の日付は選べません"; return; }
  if (!confirm(`最終実施日を ${showDate(v)} に変更しますか？`)) return;
  const ok = await updateItem({ lastDone: v, startDate: v });
  if (ok) $("editLast").hidden = true;
});

// 枠ごとの「設定・変更」（「（なし）」を選ぶと未設定に戻る）
for (const f of FRAMES) {
  $(`open-${f.key}`).addEventListener("click", () => {
    const it = items.find(x => x.id === currentId);
    if (!it) return;
    $(`new-${f.key}`).value = it[f.field] || "";
    $("detailMsg").textContent = "";
    $(`edit-${f.key}`).hidden = false;
  });
  $(`cancel-${f.key}`).addEventListener("click", () => {
    $(`edit-${f.key}`).hidden = true;
  });
  $(`save-${f.key}`).addEventListener("click", async () => {
    const v = $(`new-${f.key}`).value || null;
    const ok = await updateItem({ [f.field]: v });
    if (ok) $(`edit-${f.key}`).hidden = true;
  });
}

// ===== 項目の追加 =====
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("addMsg");
  msg.textContent = "";

  const name = $("name").value.trim();
  const count = Number($("cycleCount").value);
  if (!name) { msg.textContent = "項目名を入力してください"; return; }
  if (!Number.isInteger(count) || count < 1) { msg.textContent = "周期は1以上の整数で入力してください"; return; }

  const lastDone = $("lastDone").value;
  const frameFields = {};
  for (const f of FRAMES) frameFields[f.field] = $(`add-${f.key}`).value || null;
  try {
    await db.collection(COL).add({
      name,
      cycleCount: count,
      cycleUnit: $("cycleUnit").value,
      ...frameFields,
      lastDone,
      startDate: lastDone,
      paused: false
    });
    $("name").value = "";
    $("cycleCount").value = 1;
    $("cycleUnit").value = "w";
    for (const f of FRAMES) $(`add-${f.key}`).value = "";
    $("lastDone").value = fmt(today());
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
});

$("pushBtn").addEventListener("click", async () => {
  const msg = $("pushMsg");
  msg.textContent = "";
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator) || !firebase.messaging.isSupported()) {
      msg.textContent = "この画面では通知を使えません。ホーム画面のアイコンから開いてください。";
      return;
    }
    // iPhoneでは、ボタンを押したときに許可を求める必要がある

    if (perm !== "granted") {
      msg.textContent = "通知が許可されませんでした。設定アプリから許可できます。";
      return;
    }
    const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    const token = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) {
      msg.textContent = "登録できませんでした。もう一度押してください。";
      return;
    }
    await db.collection("housework_devices").doc(token).set({ token, updatedAt: new Date().toISOString() });
    msg.textContent = "このiPhoneで通知を受け取れるようになりました。";
  } catch (err) {
    console.error(err);
    msg.textContent = "登録できませんでした。ホーム画面から開き直して、もう一度押してください。";
  }
});

// ===== 画面の移動 =====
$("settingsBtn").addEventListener("click", () => {
  for (const f of FRAMES) $(`msg-${f.key}`).textContent = "";
  showView("settings");
});
$("settingsBackBtn").addEventListener("click", () => showView("list"));

// ===== ログイン・ログアウト =====
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = "";
  try {
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
    $("password").value = "";
  } catch (err) {
    console.error(err);
    $("loginMsg").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
  }
});

$("logoutBtn").addEventListener("click", () => auth.signOut());

buildSettings();
$("appVer").textContent = `v${APP_VERSION}`;

      if (!frameState[f.key].unsub) startFrame(f);

      try {
        await ensureDefaults(f);
      } catch (err) {
        console.error(err);
      }
    }
  } else {
    closeDetail();
    stopListening();
    for (const f of FRAMES) stopFrame(f);
