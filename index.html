<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home To Do">
<title>Home To Do</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#ffffff">
<style>
  :root { --text:#37352f; --sub:#9b9a97; --line:#e9e9e7; --btn:#37352f; --err:#d44c47; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); background: #fff; font-size: 17px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  [hidden] { display: none !important; }
  h1 { font-size: 24px; margin: 12px 0 16px; min-width: 0; overflow-wrap: anywhere; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  label { display: block; margin-top: 8px; font-size: 15px; color: var(--sub); }
  input, select {
    width: 100%; font-size: 17px; padding: 12px; margin: 4px 0 8px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  textarea { width: 100%; font-size: 16px; padding: 10px; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; color: var(--text); resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button {
    width: 100%; font-size: 17px; padding: 12px 16px; margin-top: 8px;
    border: none; border-radius: 8px; background: var(--btn); color: #fff;
  }
  button:disabled { opacity: .5; }
  button.sub { background: #f1f1ef; color: var(--text); width: auto; margin-top: 0; }
  button.small { width: auto; margin: 0 0 0 8px; padding: 8px 14px; font-size: 14px; min-height: 44px; min-width: 44px; }
  button.danger { background: #f1f1ef; color: var(--err); width: auto; margin-top: 0; }
  button.wide { background: #f1f1ef; color: var(--text); margin-top: 24px; }
  .msg { color: var(--err); font-size: 15px; min-height: 20px; }
  .empty { color: var(--sub); text-align: center; padding: 24px 0; }
  details { margin-top: 12px; }
  summary { font-size: 17px; font-weight: 600; padding: 10px 0; cursor: pointer; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item .days { color: var(--sub); font-size: 15px; white-space: nowrap; }
  .meta { color: var(--sub); font-size: 14px; }
  .info > div { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .info .label { color: var(--sub); display: inline-block; width: 6em; }
  .info .label + span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .itemName { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #editCycle .row > * { min-width: 0; }
  .hist { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .editBox { padding: 8px 0; }
  .listRow { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .listRow .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .listRow button.danger.small { margin-left: 16px; }
  /* 片手（右手）で押しやすいよう、主な操作は右側に置く */
  .actions { display: flex; gap: 8px; }
  .actions > button { flex: 1; width: auto; margin-top: 8px; }
  .actions > #doneBtn, .actions > #resumeBtn { flex: 2; }
  .spacer { flex: 1; }
  .ver { font-size: 12px; color: var(--sub); font-weight: 400; }
  .unset { color: var(--sub); }
  /* 状態のラベル（薄い色の札） */
  .badge { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 6px; padding: 2px 8px; margin-right: 6px; }
  .badge.danger { background: #fdebec; color: #9f2f2d; }
  .badge.soon { background: #fbf3db; color: #956400; }
  .badge.normal, .badge.paused { background: #f1f1ef; color: #73726e; }
  .count { color: var(--sub); font-weight: 400; font-size: 15px; }
  .tag { flex: none; width: 4.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; font-size: 13px; color: var(--text); background: #f1f1ef; border-radius: 6px; padding: 2px 4px; }
  .notice { background: #fbf6e9; border-radius: 8px; padding: 10px 12px; margin: 8px 0 4px; }
  .noticeTitle { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .noticeRow { padding: 10px 0; cursor: pointer; }
  .memo { white-space: pre-wrap; background: #fafaf8; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 15px; }
  /* 追加画面：「ラベル → 入力欄」を横に並べ、位置と幅をそろえる */
  #addForm .field { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #addForm .flabel { flex: none; width: 5.5em; font-size: 14px; color: var(--sub); white-space: nowrap; }
  #addForm .field > input, #addForm .field > select, #addForm .field > textarea, #addForm .field > .ctrl2 { flex: 1; min-width: 0; }
  #addForm .field > input, #addForm .field > select, #addForm .field > textarea { width: 100%; margin: 0; font-size: 16px; padding: 8px 10px; }
  #addForm .ctrl2 { display: flex; gap: 8px; }
  #addForm .ctrl2 > * { flex: 1; min-width: 0; width: auto; margin: 0; font-size: 16px; padding: 8px 10px; }
  #addForm input[type=date] { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ログイン画面 -->
  <section id="loginView" hidden>
    <h1>Home To Do <small id="loginVer" class="ver"></small></h1>
    <form id="loginForm">
      <label>メールアドレス

  </section>

  <!-- 一覧画面 -->

    <div class="row">
      <h1 style="flex:1">Home To Do <small id="appVer" class="ver"></small></h1>
      <button id="settingsBtn" class="sub" style="flex:none;width:auto;margin:0">設定</button>
    </div>

    <div id="notice" class="notice" hidden></div>

    <button id="openAddBtn">＋ 項目を追加</button>
    <form id="addForm" hidden>
      <div class="field">
        <span class="flabel">項目名</span>
        <input id="name" maxlength="50" placeholder="例：お風呂掃除" required>
      </div>
      <div class="field">
        <span class="flabel">周期</span>
        <div class="ctrl2">
          <input id="cycleMonth" type="number" min="1" max="12" step="1" placeholder="月" hidden>
          <input id="cycleCount" type="number" min="1" step="1" value="1" required>
          <select id="cycleUnit">
            <option value="f">毎月（数字＝日）</option>
            <option value="fy">毎年（月と日）</option>
            <option value="d">日</option>
            <option value="w" selected>週間</option>
            <option value="m">ヶ月</option>
            <option value="y">年</option>
          </select>
        </div>
      </div>
      <div class="field">
        <span class="flabel">カテゴリ</span>
        <select id="add-cat"></select>
      </div>
      <div class="field">
        <span class="flabel">対象</span>
        <select id="add-target"></select>
      </div>
      <div class="field">
        <span class="flabel">最終実施日</span>
        <input id="lastDone" type="date" required>
      </div>
      <div class="field">
        <span class="flabel">メモ</span>
        <textarea id="memo" maxlength="500" rows="2"></textarea>
      </div>
      <div class="actions">
        <button type="button" id="closeAddBtn" class="sub">閉じる</button>
        <button type="submit">＋ 追加</button>
      </div>
      <p id="addMsg" class="msg"></p>
    </form>

    <div id="list"></div>
  </section>

  <!-- 詳細画面 -->
  <section id="detailView" hidden>
    <div class="row">
      <button id="detailTopBackBtn" class="sub" style="flex:none">← 一覧</button>
    </div>
    <div class="row">
      <h1 id="dName" style="flex:1"></h1>
      <button id="editNameBtn" class="sub small" style="flex:none;white-space:nowrap">変更</button>
    </div>
    <div id="editName" class="editBox" hidden>
      <input id="newName" maxlength="50">
      <div class="actions">
        <button id="cancelNameBtn" class="sub">キャンセル</button>
        <button id="saveNameBtn">保存</button>
      </div>
    </div>

    <div class="info">
      <div><span class="label">状態</span><span id="dStatus"></span></div>
      <div><span class="label" id="dDaysLabel">経過日数</span><span id="dDays"></span></div>
      <div><span class="label">周期</span><span id="dCycle"></span><button id="editCycleBtn" class="sub small">変更</button></div>
      <div id="row-cat"><span class="label">カテゴリ</span><span id="val-cat"></span><button id="open-cat" class="sub small">変更</button></div>
      <div id="row-target"><span class="label">対象</span><span id="val-target"></span><button id="open-target" class="sub small">変更</button></div>
      <div><span class="label">最終実施日</span><span id="dLast"></span><button id="editLastBtn" class="sub small">変更</button></div>
    </div>

    <div id="editCycle" class="editBox" hidden>
      <div class="row">
        <input id="newCycleMonth" type="number" min="1" max="12" step="1" placeholder="月" hidden>
        <input id="newCycleCount" type="number" min="1" step="1">
        <select id="newCycleUnit">
          <option value="f">毎月（数字＝日）</option>
          <option value="fy">毎年（月と日）</option>
          <option value="d">日</option>
          <option value="w">週間</option>
          <option value="m">ヶ月</option>
          <option value="y">年</option>
        </select>
      </div>
      <div class="actions">
        <button id="cancelCycleBtn" class="sub">キャンセル</button>
        <button id="saveCycleBtn">保存</button>
      </div>
    </div>

    <div id="memoView" class="memo" hidden></div>
    <button id="editMemoBtn" class="sub" style="margin-top:8px">📝 メモを編集</button>
    <div id="editMemo" class="editBox" hidden>
      <textarea id="newMemo" maxlength="500" rows="4"></textarea>
      <div class="actions">
        <button id="cancelMemoBtn" class="sub">キャンセル</button>
        <button id="saveMemoBtn">保存</button>
      </div>
    </div>

    <div id="editLast" class="editBox" hidden>
      <input id="newLast" type="date">
      <div class="actions">
        <button id="cancelLastBtn" class="sub">キャンセル</button>
        <button id="saveLastBtn">保存</button>
      </div>
    </div>

    <div id="edit-cat" class="editBox" hidden>
      <select id="new-cat"></select>
      <div class="actions">
        <button id="cancel-cat" class="sub">キャンセル</button>
        <button id="save-cat">保存</button>
      </div>
    </div>

    <div id="edit-target" class="editBox" hidden>
      <select id="new-target"></select>
      <div class="actions">
        <button id="cancel-target" class="sub">キャンセル</button>
        <button id="save-target">保存</button>
      </div>
    </div>

    <div id="activeActions" class="actions">
      <button id="pauseBtn" class="sub">⏸️ 一時停止</button>
      <button id="doneBtn">✅ 実施した</button>
    </div>
    <div id="pausedActions" class="actions" hidden>
      <span class="spacer"></span>
      <button id="resumeBtn">▶️ 再開</button>
    </div>
    <p id="detailMsg" class="msg"></p>

    <h2>実施履歴</h2>
    <div id="history"></div>
    <button id="moreBtn" class="sub" hidden>もっと見る</button>

    <button id="deleteBtn" class="danger" style="width:100%;margin-top:24px">🗑 この項目を削除</button>
    <button id="backBtn" class="wide">← 一覧に戻る</button>
  </section>

  <!-- 設定画面 -->
  <section id="settingsView" hidden>
    <div class="row">
      <button id="settingsBackBtn" class="sub">← 一覧</button>
    </div>
    <h1>設定</h1>

    <div id="settingsFrames"></div>

    <h2>通知</h2>
    <p class="meta">ホーム画面のアイコンから開いて、通知を許可してください。</p>
    <button id="pushBtn">🔔 この端末で通知を受け取る</button>
    <p id="pushMsg" class="msg"></p>

    <h2>アカウント</h2>
    <button id="logoutBtn" class="danger" style="width:100%">ログアウト</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ===== Firebaseの接続情報 =====
const firebaseConfig = {
  apiKey: "AIzaSyAfqtmYf_-inDRo6yEfbfkJjTAlBtHPao8",
  authDomain: "house-todo-1ef41.firebaseapp.com",
  projectId: "house-todo-1ef41",
  storageBucket: "house-todo-1ef41.firebasestorage.app",
  messagingSenderId: "956040670932",
  appId: "1:956040670932:web:ee3b3d87e7f7e14b2ad541"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// 電波が弱いときも、保存した内容を端末に残して、つながったら送る
db.enablePersistence({ synchronizeTabs: true }).catch(err => console.error(err));
const COL = "housework_items";         // 項目
const HIST = "housework_history";      // 実施履歴（{ itemId, date }）
const SETTINGS = "housework_settings"; // 初期データを入れたかどうかの印
const APP_VERSION = "2.11";             // 変更するたびに上げる

// 項目に付ける「枠」。カテゴリと対象は別々に管理する
const FRAMES = [
  {
    key: "cat", label: "カテゴリ", coll: "housework_categories", field: "categoryId",
    seeded: "categoriesSeeded",
    defaults: ["掃除", "メンテナンス", "消耗品・交換", "身の回り", "その他"]
  },
  {
    key: "target", label: "対象", coll: "housework_targets", field: "targetId",
    seeded: "targetsSeeded",
    defaults: ["人の名前", "家", "車"]
  }
];
const frameState = Object.fromEntries(FRAMES.map(f => [f.key, { list: [], unsub: null }]));
const frameOf = key => FRAMES.find(f => f.key === key);

// ===== 日付の小さな道具 =====
const DAY = 86400000;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const showDate = s => s.replaceAll("-", "/");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

// 日・週間は日数で足す。ヶ月・年は暦の上で足し、月末は月の最終日に合わせる
function addPeriod(base, unit, count) {
  if (unit === "d" || unit === "w") {
    const days = unit === "w" ? 7 * count : count;
    return new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
  }
  const months = unit === "y" ? 12 * count : count;
  const first = new Date(base.getFullYear(), base.getMonth() + months, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(base.getDate(), last));
}

// 毎月○日の項目の、次の期日と残り日数
function dueInfo(it) {
  if (!(it.startDate || it.lastDone)) return { due: today(), left: 0 };
  const due = firstDue(it, parse(it.startDate || it.lastDone));
  const left = Math.round((due - today()) / DAY);
  return { due, left };
}

function dueLeftText(left) {
  if (left > 0) return `あと${left}日`;
  if (left === 0) return "今日が期日";
  return `${-left}日過ぎ`;
}

// 毎月・毎年の期日かどうか
function isFixed(it) {
  return it.cycleUnit === "f" || it.cycleUnit === "fy";
}

// 毎月・毎年の項目の「今回の期日」。期日の近く（周期の半分以内）より前に実施していたら、
// その回は済んだものとして、次の回を期日にする
const EARLY_DAYS = { f: 15, fy: 183 };
function firstDue(it, base) {
  const d = nextDue(it, base);
  return Math.round((d - base) / DAY) < EARLY_DAYS[it.cycleUnit] ? nextDue(it, d) : d;
}

// 毎月○日・毎年○月○日の、基準日より後の次の期日
function nextDue(it, after) {
  return it.cycleUnit === "fy"
    ? nextYearly(after, it.cycleMonth, it.cycleCount)
    : nextFixed(after, it.cycleCount);
}

// 毎年○月○日の期日：基準日より後で、最初に来る日（2月29日は、平年なら2月末日にする）
function nextYearly(after, month, day) {
  for (let i = 0; i < 2; i++) {
    const y = after.getFullYear() + i;
    const last = new Date(y, month, 0).getDate();
    const cand = new Date(y, month - 1, Math.min(day, last));
    if (cand > after) return cand;
  }
}

// 毎月○日の期日：基準日より後で、最初に来る「○日」（月末を超える日は末日にする）
function nextFixed(after, day) {
  let y = after.getFullYear();
  let m = after.getMonth();
  for (let i = 0; i < 2; i++) {
    const last = new Date(y, m + 1, 0).getDate();
    const cand = new Date(y, m, Math.min(day, last));
    if (cand > after) return cand;
    m++;
    if (m > 11) { m = 0; y++; }
  }
}

// 状態判定：計測開始日を基準に、1周期後以上で「そろそろ」、2周期後以上で「やばい」
// 一時停止中は、停止した時点の経過日数を保持する
function judge(item) {
  if (item.paused) {
    return { key: "paused", days: item.pausedDays ?? 0 };
  }
  if (!(item.startDate || item.lastDone)) return { key: "normal", days: 0 }; // 日付がない古いデータで止まらないように
  const base = parse(item.startDate || item.lastDone);
  const t = today();
  let next1, next2;
  if (isFixed(item)) {
    // 毎月・毎年：実施日に関係なく、決まった日が期日になる
    next1 = firstDue(item, base);
    next2 = nextDue(item, next1);
  } else {
    next1 = addPeriod(base, item.cycleUnit, item.cycleCount);
    next2 = addPeriod(base, item.cycleUnit, item.cycleCount * 2);
  }
  const days = Math.round((t - base) / DAY);
  let key = "normal";
  if (t >= next2) key = "danger";
  else if (t >= next1) key = "soon";
  return { key, days };
}

// 状態を薄い色のラベルで出す
function badge(key) {
  const b = document.createElement("span");
  b.className = `badge ${key}`;
  b.textContent = LABEL[key];
  return b;
}
const LABEL = { danger: "やばい", soon: "そろそろ", normal: "通常", paused: "一時停止中" };
const UNIT = { d: "日", w: "週間", m: "ヶ月", y: "年" };
const ORDER = ["danger", "soon", "normal", "paused"];

// 周期の表示（「毎月」は、数字を日付として扱う）
function cycleText(it) {
  if (it.cycleUnit === "f") return `毎月${it.cycleCount}日`;
  if (it.cycleUnit === "fy") return `毎年${it.cycleMonth}月${it.cycleCount}日`;
  return `${it.cycleCount}${UNIT[it.cycleUnit]}`;
}

// ===== 画面の状態 =====
let items = [];
let unsubscribe = null;
let currentId = null;
let histItems = [];
let histUnsub = null;
let showAllHist = false;

function showView(name) {
  $("loginView").hidden = name !== "login";
  $("appView").hidden = name !== "list";
  $("detailView").hidden = name !== "detail";
  $("settingsView").hidden = name !== "settings";
}

// ===== 枠（カテゴリ・対象）の共通処理 =====
function frameName(f, id) {
  const c = frameState[f.key].list.find(x => x.id === id);
  return c ? c.name : null;
}

// 初回だけ、既定の選択肢を入れる（同じIDで書くので、2台同時でも重複しない）
async function ensureDefaults(f) {
  const ref = db.collection(SETTINGS).doc("main");
  const snap = await ref.get();
  if (snap.exists && snap.data()[f.seeded]) return;
  const batch = db.batch();
  f.defaults.forEach((name, i) => {
    batch.set(db.collection(f.coll).doc(`default-${i + 1}`), { name, order: i + 1 });
  });
  batch.set(ref, { [f.seeded]: true }, { merge: true });
  await batch.commit();
}

function startFrame(f) {
  const st = frameState[f.key];
  st.unsub = db.collection(f.coll).onSnapshot(
    snap => {
      st.list = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.id.localeCompare(b.id));
      renderFrameUI();
    },
    err => console.error(err)
  );
}

function stopFrame(f) {
  const st = frameState[f.key];
  if (st.unsub) st.unsub();
  st.unsub = null;
  st.list = [];
}

// 選択肢（追加フォーム・詳細の変更欄）と、設定画面の一覧を作り直す
function renderFrameUI() {
  for (const f of FRAMES) {
    const list = frameState[f.key].list;
    for (const sel of [$(`add-${f.key}`), $(`new-${f.key}`)]) {
      const cur = sel.value;
      sel.textContent = "";
      sel.appendChild(new Option("（なし）", ""));
      list.forEach(c => sel.appendChild(new Option(c.name, c.id)));
      sel.value = cur;
    }
    renderFrameList(f);
  }
  render(); // 一覧の対象名も、枠の読み込み後に出し直す
  if (currentId) renderDetail();
}

// 鉛筆（名前変更）とゴミ箱（削除）のボタンを並べる
function renderFrameList(f) {
  const box = $(`list-${f.key}`);
  const list = frameState[f.key].list;
  box.textContent = "";
  if (!list.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = `${f.label}はまだありません`;
    box.appendChild(p);
    return;
  }
  for (const c of list) {
    const row = document.createElement("div");
    row.className = "listRow";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = c.name;

    const renameBtn = document.createElement("button");
    renameBtn.className = "sub small";
    renameBtn.textContent = "✏️";
    renameBtn.title = "名前変更";
    renameBtn.addEventListener("click", () => renameFrameItem(f, c));

    const delBtn = document.createElement("button");
    delBtn.className = "danger small";
    delBtn.textContent = "🗑";
    delBtn.title = "削除";
    delBtn.addEventListener("click", () => deleteFrameItem(f, c));

    row.append(name, renameBtn, delBtn);
    box.appendChild(row);
  }
}

function hasSameName(f, name, exceptId) {
  return frameState[f.key].list.some(c => c.name === name && c.id !== exceptId);
}

async function renameFrameItem(f, c) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  const next = (prompt("新しい名前", c.name) ?? "").trim();
  if (!next || next === c.name) return;
  if (hasSameName(f, next, c.id)) { msg.textContent = "同じ名前があります"; return; }
  try {
    await db.collection(f.coll).doc(c.id).update({ name: next });
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

// 削除：所属する項目は未設定にする（項目自体は消さない）
async function deleteFrameItem(f, c) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  if (!confirm(`「${c.name}」を削除しますか？\n所属している項目は未設定になります。`)) return;
  try {
    const ops = items.filter(it => it[f.field] === c.id)
      .map(it => b => b.update(db.collection(COL).doc(it.id), { [f.field]: null }));
    ops.push(b => b.delete(db.collection(f.coll).doc(c.id)));
    await commitInChunks(ops);
  } catch (err) {
    console.error(err);
    msg.textContent = "削除できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

async function addFrameItem(f) {
  const msg = $(`msg-${f.key}`);
  msg.textContent = "";
  const input = $(`input-${f.key}`);
  const name = input.value.trim();
  if (!name) { msg.textContent = `${f.label}名を入力してください`; return; }
  if (hasSameName(f, name, null)) { msg.textContent = "同じ名前があります"; return; }
  const order = frameState[f.key].list.reduce((m, c) => Math.max(m, c.order ?? 0), 0) + 1;
  try {
    await db.collection(f.coll).add({ name, order });
    input.value = "";
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  }
}

// 設定画面の枠ごとの部品を作る
function buildSettings() {
  const root = $("settingsFrames");
  for (const f of FRAMES) {
    const h = document.createElement("h2");
    h.textContent = `${f.label}管理`;
    const listBox = document.createElement("div");
    listBox.id = `list-${f.key}`;
    const form = document.createElement("form");
    form.id = `form-${f.key}`;
    form.innerHTML =
      `<label>新しい${f.label}名<input id="input-${f.key}" maxlength="20" required></label>` +
      `<button type="submit">＋ ${f.label}を追加</button>` +
      `<p id="msg-${f.key}" class="msg"></p>`;
    form.addEventListener("submit", e => { e.preventDefault(); addFrameItem(f); });

}

// ===== 一覧の表示 =====
function render() {
  const list = $("list");
  list.textContent = "";
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "登録されている項目はありません";
    list.appendChild(p);
    return;
  }

  const judged = items.map(it => ({ ...it, ...judge(it) }));
  judged.sort((a, b) =>
    ORDER.indexOf(a.key) - ORDER.indexOf(b.key) ||
    b.days - a.days ||
    a.id.localeCompare(b.id)
  );

  for (const key of ORDER) {
    const group = judged.filter(x => x.key === key);
    if (!group.length) continue;

    const details = document.createElement("details");
    details.open = key !== "normal";
    const summary = document.createElement("summary");
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = `${group.length}件`;
    summary.append(badge(key), cnt);
    details.appendChild(summary);

    for (const it of group) {
      const row = document.createElement("div");
      row.className = "item";
      row.addEventListener("click", () => openDetail(it.id));

      // 丸とタスク名の間に、対象の名前を小さく表示する
      const tName = it.targetId ? frameName(frameOf("target"), it.targetId) : null;
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = tName || "";
      // 対象がなくても場所は空けておき、タスク名の開始位置をそろえる
      tag.style.visibility = tName ? "visible" : "hidden";

      const left = document.createElement("div");
      left.className = "itemName";
      const title = document.createElement("div");
      title.textContent = it.name;
      left.append(title);

      const days = document.createElement("span");
      days.className = "days";
      // 毎月○日の項目は、経過日数ではなく期日までの日数を出す
      days.textContent = (isFixed(it) && !it.paused)
        ? dueLeftText(dueInfo(it).left)
        : `${it.days}日`;

      row.append(tag, left, days);
      details.appendChild(row);
    }
    list.appendChild(details);
  }
}

function startListening() {
  unsubscribe = db.collection(COL).onSnapshot(
    snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      checkNotices();
      render();
      if (currentId) renderDetail();
    },
    err => {
      console.error(err);
      $("list").textContent = err.code === "permission-denied"
        ? "このアカウントには使う権限がありません。"
        : "データを読み込めませんでした。通信状態を確認して、開き直してください。";
    }
  );
}

function stopListening() {
  notices = [];
  renderNotice();
  if (unsubscribe) unsubscribe();
  unsubscribe = null;
  items = [];
  $("list").textContent = "";
}

// ===== お知らせ（アプリを開いたときに、状態が変わった項目を知らせる） =====
// 通知済みの状態は、この端末ごとに保存する（同じ状態で何度も出さないため）
const NOTIFIED_KEY = "housework_notified";
let notices = [];

function loadNotified() {
  try { return JSON.parse(localStorage.getItem(NOTIFIED_KEY) || "{}"); } catch (e) { return {}; }
}

function saveNotified(map) {
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(map)); } catch (e) { console.error(e); }
}

function checkNotices() {
  const map = loadNotified();
  let changed = false;
  const found = [];
  for (const it of items) {
    if (it.paused) continue; // 一時停止中は知らせない
    const { key } = judge(it);
    if (key === "normal") {
      if (map[it.id]) { delete map[it.id]; changed = true; } // 通常に戻ったら、次の変化で再び知らせる
      continue;
    }
    if (map[it.id] !== key) {
      map[it.id] = key;
      changed = true;
      found.push({ id: it.id, name: it.name, key });
    }
  }
  if (changed) saveNotified(map);

  for (const n of found) {
    notices = notices.filter(x => x.id !== n.id);
    notices.push(n);
  }
  // 項目が消えた、通常に戻った、停止した場合は、お知らせから外す
  notices = notices.filter(n => items.some(it => it.id === n.id && !it.paused && judge(it).key === n.key));
  renderNotice();
}

function renderNotice() {
  const box = $("notice");
  box.textContent = "";
  if (!notices.length) { box.hidden = true; return; }
  box.hidden = false;

  const title = document.createElement("div");
  title.className = "noticeTitle";
  title.textContent = "お知らせ";
  box.appendChild(title);

  for (const n of notices) {
    const row = document.createElement("div");
    row.className = "noticeRow";
    const nm = document.createElement("span");
    nm.textContent = n.name;
    row.append(badge(n.key), nm);
    row.addEventListener("click", () => openDetail(n.id));
    box.appendChild(row);
  }

  const close = document.createElement("button");
  close.className = "sub";
  close.textContent = "閉じる";
  close.style.marginTop = "6px";
  close.addEventListener("click", () => { notices = []; renderNotice(); });
  box.appendChild(close);
}

// ===== 詳細画面 =====
function openDetail(id) {
  currentId = id;
  showAllHist = false;
  $("detailMsg").textContent = "";
  for (const el of ["editName", "editCycle", "editMemo", "editLast", "edit-cat", "edit-target"]) {
    $(el).hidden = true;
  }
  if (histUnsub) histUnsub();
  histUnsub = db.collection(HIST).where("itemId", "==", id).onSnapshot(
    snap => {
      histItems = snap.docs.map(d => d.data().date).sort().reverse();
      renderDetail();
    },
    err => console.error(err)
  );
  renderDetail();
  showView("detail");
  window.scrollTo(0, 0);
}

function closeDetail() {
  currentId = null;
  if (histUnsub) histUnsub();
  histUnsub = null;
  histItems = [];
  showView("list");
}

function renderDetail() {
  const it = items.find(x => x.id === currentId);
  if (!it) { closeDetail(); return; } // 項目が見つからない場合は一覧へ戻る
  const j = judge(it);

  $("dName").textContent = it.name;
  $("dStatus").textContent = "";
  $("dStatus").appendChild(badge(j.key));
  if (isFixed(it) && !it.paused) {
    const d = dueInfo(it);
    $("dDaysLabel").textContent = "次の期日";
    $("dDays").textContent = `${showDate(fmt(d.due))}（${dueLeftText(d.left)}）`;
  } else {
    $("dDaysLabel").textContent = "経過日数";
    $("dDays").textContent = `${j.days}日`;
  }
  $("dCycle").textContent = cycleText(it);
  $("dLast").textContent = it.lastDone ? showDate(it.lastDone) : "未設定";

  // 枠は常に表示し、未設定のときは「未設定」と出す
  for (const f of FRAMES) {
    const name = it[f.field] ? frameName(f, it[f.field]) : null;
    const val = $(`val-${f.key}`);
    val.textContent = name || "未設定";
    val.classList.toggle("unset", !name);
  }

  // メモは、書いてあるときだけ表示する
  $("memoView").textContent = it.memo || "";
  $("memoView").hidden = !it.memo;

  // 一時停止中は「実施した」「一時停止」を隠し、「再開」だけ出す
  $("activeActions").hidden = Boolean(it.paused);
  $("pausedActions").hidden = !it.paused;

  const hist = $("history");
  hist.textContent = "";
  const shown = showAllHist ? histItems : histItems.slice(0, 5);
  if (!shown.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "まだ実施履歴はありません";
    hist.appendChild(p);
  }
  for (const date of shown) {
    const row = document.createElement("div");
    row.className = "hist";
    row.textContent = showDate(date);
    hist.appendChild(row);
  }
  $("moreBtn").hidden = showAllHist || histItems.length <= 5;
}

$("backBtn").addEventListener("click", closeDetail);
$("detailTopBackBtn").addEventListener("click", closeDetail);
$("moreBtn").addEventListener("click", () => { showAllHist = true; renderDetail(); });

// たくさんの削除・更新は、450件ずつに分けて保存する（1回の上限が500件のため）
async function commitInChunks(ops) {
  for (let i = 0; i < ops.length; i += 450) {
    const batch = db.batch();
    ops.slice(i, i + 450).forEach(op => op(batch));
    await batch.commit();
  }
}

// 共通：項目の更新を保存。成功なら true、失敗ならメッセージを出して false
async function updateItem(fields) {
  const it = items.find(x => x.id === currentId);
  if (!it) return false;
  $("detailMsg").textContent = "";
  try {
    await db.collection(COL).doc(it.id).update(fields);
    return true;
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
    return false;
  }
}

// 「実施した」：最終実施日と計測開始日を今日にし、履歴を追加する（まとめて保存）
$("doneBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  $("detailMsg").textContent = "";
  if (!confirm("実施しましたか？")) return;

  const btn = $("doneBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  const dateStr = fmt(today());
  try {
    const batch = db.batch();
    batch.update(db.collection(COL).doc(it.id), { lastDone: dateStr, startDate: dateStr });
    // 履歴のIDを「項目_日付」にして、同じ日に2回押しても1件にする
    batch.set(db.collection(HIST).doc(`${it.id}_${dateStr}`), { itemId: it.id, date: dateStr });
    await batch.commit();
  } catch (err) {
    console.error(err);
    $("detailMsg").textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  } finally {
    btn.disabled = false;
  }
});

// 一時停止：停止した時点の経過日数を保存する（履歴には残さない）
$("pauseBtn").addEventListener("click", async () => {
  const it = items.find(x => x.id === currentId);
  if (!it) return;
  if (!confirm("一時停止しますか？")) return;
  await updateItem({ paused: true, pausedDays: judge(it).days });

$("resumeBtn").addEventListener("click", async () => {
  if (!confirm("再開しますか？")) return;
  await updateItem({ paused: false, pausedDays: 0, startDate: fmt(today()) });
});

    const hist = await db.collection(HIST).where("itemId", "==", it.id).get();

// 追加フォームは、ふだんは閉じておき、「＋ 項目を追加」で開く

$("openAddBtn").addEventListener("click", () => setAddOpen(true));

$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("addMsg");
  msg.textContent = "";

  const name = $("name").value.trim();
  const count = Number($("cycleCount").value);
  if (!name) { msg.textContent = "項目名を入力してください"; return; }
  const unit = $("cycleUnit").value;
  const month = Number($("cycleMonth").value);
  const badMonth = unit === "fy" && (!Number.isInteger(month) || month < 1 || month > 12 || count > new Date(2024, month, 0).getDate());
  if (!Number.isInteger(count) || count < 1 || ((unit === "f" || unit === "fy") && count > 31) || badMonth) {
    msg.textContent = "周期は1以上の整数で入力してください（毎月の日付は1〜31）";
    return;
  }

  const lastDone = $("lastDone").value;
  if (!lastDone) { msg.textContent = "最終実施日を入力してください"; return; }
  if (lastDone > fmt(today())) { msg.textContent = "今日より後の日付は選べません"; return; }
  const frameFields = {};
  for (const f of FRAMES) frameFields[f.field] = $(`add-${f.key}`).value || null;
  const btn = $("addForm").querySelector("button[type=submit]");
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await db.collection(COL).add({
      name,
      cycleCount: count,
      cycleUnit: $("cycleUnit").value,
      cycleMonth: unit === "fy" ? month : null,
      ...frameFields,
      lastDone,
      startDate: lastDone,
      memo: $("memo").value.trim() || null,
      paused: false
    });
    $("name").value = "";
    $("cycleCount").value = "1";
    $("cycleUnit").value = "w";
    $("cycleMonth").hidden = true;
    for (const f of FRAMES) $(`add-${f.key}`).value = "";
    $("memo").value = "";
    $("lastDone").value = fmt(today());
    setAddOpen(false);
  } catch (err) {
    console.error(err);
    msg.textContent = "保存できませんでした。通信状態を確認して、もう一度押してください。";
  } finally {
    btn.disabled = false;
  }
});

// ===== このiPhoneを通知の送り先として登録する =====
const VAPID_KEY = "BE5Px2M0nWrz-UNpxzih6EGRHREyaPcbtqCem47Psv_I2e5SGRF3_pkJUKluVO9rvrZefhnIR3NIwEQFjxwEZZ4";
const TOKEN_KEY = "housework_push_token";
const TOKEN_DAY_KEY = "housework_push_day";

function pushReady() {
  return "Notification" in window && "serviceWorker" in navigator && firebase.messaging.isSupported();
}

// 通知の送り先（この端末）を登録する。トークンが入れ替わっても追いつけるよう、毎回取り直す
async function registerDevice() {
  const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
  const token = await firebase.messaging().getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) return null;
  const old = localStorage.getItem(TOKEN_KEY);
  if (old && old !== token) {
    try { await db.collection("housework_devices").doc(old).delete(); } catch (e) { console.error(e); }
  }
  await db.collection("housework_devices").doc(token).set({ token, updatedAt: new Date().toISOString() });
  try {
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(TOKEN_DAY_KEY, fmt(today()));
  } catch (e) { console.error(e); }
  return token;
}

// 通知を許可済みなら、1日1回だけ登録を新しくする（何も表示しない）
async function refreshDevice() {
  try {
    if (!pushReady() || Notification.permission !== "granted") return;
    if (localStorage.getItem(TOKEN_DAY_KEY) === fmt(today())) return;
    await registerDevice();
  } catch (e) { console.error(e); }
}

// ログアウトするときは、この端末への通知も止める
// （電波がないときに待ち続けないよう、3秒で先に進む）
async function unregisterDevice() {
  const work = (async () => {
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) await db.collection("housework_devices").doc(token).delete();
    if (pushReady() && Notification.permission === "granted") await firebase.messaging().deleteToken();
  })();
  try {
    await Promise.race([work, new Promise(r => setTimeout(r, 3000))]);
  } catch (e) { console.error(e); }
  try {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_DAY_KEY);
  } catch (e) { console.error(e); }
}

$("pushBtn").addEventListener("click", async () => {
  const msg = $("pushMsg");
  msg.textContent = "";
  try {
    if (!pushReady()) {
      msg.textContent = "この画面では通知を使えません。ホーム画面のアイコンから開いてください。";
      return;
    }
    // iPhoneでは、ボタンを押したときに許可を求める必要がある
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      msg.textContent = "通知が許可されませんでした。設定アプリから許可できます。";
      return;
    }
    const token = await registerDevice();
    if (!token) {
      msg.textContent = "登録できませんでした。もう一度押してください。";
      return;
    }
    msg.textContent = "この端末で通知を受け取れるようになりました。";
  } catch (err) {
    console.error(err);
    msg.textContent = "登録できませんでした。ホーム画面から開き直して、もう一度押してください。";
  }
});

// ===== 画面の移動 =====
$("settingsBtn").addEventListener("click", () => {
  for (const f of FRAMES) $(`msg-${f.key}`).textContent = "";
  showView("settings");
});
$("settingsBackBtn").addEventListener("click", () => showView("list"));

// ===== ログイン・ログアウト =====
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginMsg").textContent = "";
  try {
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
    $("password").value = "";
  } catch (err) {
    console.error(err);
    $("loginMsg").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
  }
});

$("logoutBtn").addEventListener("click", async () => {
  if (!confirm("ログアウトしますか？\nこの端末には通知が届かなくなります。")) return;
  await unregisterDevice();
  await auth.signOut();
});

// アプリを開いたまま日付が変わっても、戻ってきたときに状態と日数を出し直す
let shownDay = fmt(today());
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !auth.currentUser) return;
  const d = fmt(today());
  if (d === shownDay) return;
  shownDay = d;
  $("lastDone").value = d;
  $("lastDone").max = d;
  checkNotices();
  render();
  if (currentId) renderDetail();
  refreshDevice();
});

buildSettings();
$("appVer").textContent = `v${APP_VERSION}`;
$("loginVer").textContent = `v${APP_VERSION}`;

auth.onAuthStateChanged(async user => {
  if (user) {
    showView("list");
    $("lastDone").value = fmt(today());
    $("lastDone").max = fmt(today());
    if (!unsubscribe) startListening();
    refreshDevice();
    for (const f of FRAMES) {
      if (!frameState[f.key].unsub) startFrame(f);
    }
    for (const f of FRAMES) {
      try {
        await ensureDefaults(f);
      } catch (err) {
        console.error(err);
      }
    }
  } else {
    closeDetail();
    stopListening();
    for (const f of FRAMES) stopFrame(f);
    showView("login");
  }
});
</script>
