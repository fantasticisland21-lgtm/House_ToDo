name: 通知チェック

on:
  schedule:
    - cron: "0 * * * *"   # 1時間ごと（UTC）
  workflow_dispatch:       # 手動でも実行できる

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install firebase-admin
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
