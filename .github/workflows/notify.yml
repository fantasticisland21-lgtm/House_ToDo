name: 通知チェック

on:
  schedule:
    - cron: "50 22 * * *"   # 朝、日本時間7:50ごろ（UTCで22:50）：状態が変わった項目
    - cron: "50 10 * * *"   # 夜、日本時間19:50ごろ（UTCで10:50）：残っている項目のまとめ
  workflow_dispatch:       # 手動でも実行できる

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install firebase-admin@12
      - run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
